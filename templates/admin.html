<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zion - Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="keywords" content="JAMB, SUCCESS, ANSWER, PAST-QUESTIONS, QUESTION, SOLUTION">
<link rel="icon" href="../static/images/logo.png">
<link href="../static/css/styles.css" rel="stylesheet" type="text/css">

<style>
body{
    font-family:'Segoe UI',sans-serif;
    background:#f0f2f5;
    margin:0;
}

header{
    background:#20a63b;
    color:white;
    text-align:center;
    padding:1.2rem;
}

.container{
    max-width:1100px;
    margin:2rem auto;
    background:white;
    padding:1.5rem;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:0.7rem;
    border:1px solid #ddd;
    text-align:center;
}

th{
    background:#D0842F;
    color:white;
}

tr:nth-child(even){
    background:#f7f7f7;
}

tr:hover{
    background:#eee;
}

.retry-btn{
    position:fixed;
    right:30px;
    bottom:30px;
    padding:12px 25px;
    background:#20a63b;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.login-section{
    max-width:400px;
    margin:5rem auto;
    background:white;
    padding:2rem;
    border-radius:8px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.login-section input{
    padding:0.5rem;
    width:80%;
    margin-bottom:1rem;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<header>
<h2>Admin Panel</h2>
</header>

<button class="retry-btn" onclick="window.location.href='/'">Go Home</button>

<!-- Login -->
<div class="login-section" id="loginSection">
<h3>Admin Login</h3>

<input type="password" id="adminPassword" placeholder="Enter admin password">

<br>

<button onclick="checkPassword()">Login</button>

<p id="loginError" style="color:red;display:none;">Incorrect password</p>

</div>

<!-- Records -->
<div class="container hidden" id="recordsContainer">

<h2>Attempts History</h2>

<table>
<thead>
<tr>
<th>Date</th>
<th>Name</th>
<th>Telephone</th>
<th>Subject</th>
<th>Score</th>
</tr>
</thead>

<tbody>

{% for attempt in leaderboard %}

<tr>
<td>{{ attempt.date.strftime('%Y-%m-%d %H:%M') }}</td>
<td>{{ attempt.name }}</td>
<td>{{ attempt.tel }}</td>
<td>{{ attempt.subject }}</td>
<td>{{ attempt.score }} / {{ attempt.total }}</td>
</tr>

{% endfor %}

</tbody>
</table>

</div>

<script>

const ADMIN_PASSWORD = "zion";

function checkPassword(){

const input=document.getElementById("adminPassword").value;

if(input===ADMIN_PASSWORD){

document.getElementById("loginSection").classList.add("hidden");
document.getElementById("recordsContainer").classList.remove("hidden");

}else{

document.getElementById("loginError").style.display="block";

}

}

</script>

</body>
</html>
